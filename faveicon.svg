<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="#1a365d"/>
  
  <!-- Hotel building silhouette -->
  <rect x="22" y="30" width="36" height="52" fill="#4299e1" rx="2"/>
  
  <!-- Building windows (3x4 grid) -->
  <g fill="#bee3f8">
    <rect x="27" y="36" width="6" height="6" rx="1"/>
    <rect x="37" y="36" width="6" height="6" rx="1"/>
    <rect x="47" y="36" width="6" height="6" rx="1"/>
    
    <rect x="27" y="47" width="6" height="6" rx="1"/>
    <rect x="37" y="47" width="6" height="6" rx="1"/>
    <rect x="47" y="47" width="6" height="6" rx="1"/>
    
    <rect x="27" y="58" width="6" height="6" rx="1"/>
    <rect x="37" y="58" width="6" height="6" rx="1"/>
    <rect x="47" y="58" width="6" height="6" rx="1"/>
  </g>
  
  <!-- Door/entrance -->
  <rect x="35" y="70" width="10" height="12" fill="#2c5282" rx="1"/>
  
  <!-- Data bars (chart) to the right of the building -->
  <g fill="#48bb78">
    <rect x="64" y="66" width="6" height="16" rx="1"/>
    <rect x="72" y="56" width="6" height="26" rx="1"/>
    <rect x="80" y="46" width="6" height="36" rx="1"/>
  </g>
  
  <!-- Trending arrow over data bars -->
  <path d="M 64 48 L 72 40 L 78 44 L 86 34" 
        stroke="#f6ad55" stroke-width="3" fill="none" 
        stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="86,34 82,35 85,39" fill="#f6ad55"/>
  
  <!-- Magnifying glass hint (viewer element) -->
  <circle cx="30" cy="22" r="6" fill="none" stroke="#f6ad55" stroke-width="2.5"/>
  <line x1="34.5" y1="26.5" x2="38" y2="30" stroke="#f6ad55" stroke-width="2.5" stroke-linecap="round"/>
</svg>